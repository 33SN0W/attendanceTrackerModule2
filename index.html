<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Section E Attendance</title>
<meta name="description" content="Missed-class tracker for Section E, Module 2. Limit: 3 misses per course.">
<meta name="theme-color" content="#17191c">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Attendance">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M0 0h50l14 14v50H0z' fill='%23ffc21a'/%3E%3Cpath d='M14 46V18h9l9 16 9-16h9v28' fill='none' stroke='%23121314' stroke-width='6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<script>
  document.documentElement.classList.add(
    window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'still' : 'motion'
  );
</script>
<style>
  :root {
    --bg: #17191c;
    --grid: rgba(255, 255, 255, .032);
    --plate: #1f2226;
    --plate-2: #262a2f;
    --line: #3a4047;
    --line-2: #505861;
    --text: #eceef0;
    --muted: #9aa3ac;
    --dim: #69717a;
    --yellow: #ffc21a;
    --orange: #ff6a1a;
    --red: #ff3d2e;
    --ink: #121314;
    --cut: 22px;
    --f: 'Archivo', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 32px 32px;
    color: var(--text);
    font: 400 16px/1.4 var(--f);
    overflow-x: hidden;
  }
  button { font-family: inherit; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ---------- hazard tape ticker ---------- */
  .tape {
    position: relative;
    height: 36px;
    overflow: hidden;
    background: var(--yellow);
    color: var(--ink);
    transform-origin: top center;
    border-bottom: 2px solid var(--ink);
  }
  .tape-track {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    display: flex;
    align-items: center;
    white-space: nowrap;
    will-change: transform;
  }
  .tape-item {
    padding: 0 18px;
    font-weight: 800;
    font-stretch: 112%;
    font-size: 13px;
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  .tape-sep {
    width: 44px; height: 100%;
    flex: none;
    background: repeating-linear-gradient(-45deg, var(--ink) 0 7px, transparent 7px 14px);
  }

  /* ---------- page frame ---------- */
  .wrap {
    max-width: 1320px;
    margin: 0 auto;
    padding: 40px 32px 48px;
  }

  .head {
    display: grid;
    grid-template-columns: 1fr minmax(300px, 380px);
    gap: 28px 48px;
    align-items: end;
    margin-bottom: 36px;
  }
  .title {
    margin: 0;
    font-weight: 900;
    font-stretch: 62%;
    font-size: clamp(76px, 13.5vw, 184px);
    line-height: .8;
    letter-spacing: -.01em;
    text-transform: uppercase;
  }
  .chars { display: inline-flex; }
  .ch { display: inline-block; overflow: hidden; padding-top: .04em; margin-top: -.04em; }
  .ch > span { display: inline-block; }
  .ch.sp { width: .2em; }
  .sub {
    margin: 18px 0 0;
    display: flex;
    align-items: center;
    gap: 14px;
    font-weight: 700;
    font-stretch: 125%;
    font-size: 15px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .sub::before {
    content: '';
    width: 36px; height: 12px;
    background: repeating-linear-gradient(-45deg, var(--yellow) 0 5px, transparent 5px 10px);
  }

  .overview {
    padding-bottom: 6px;
  }
  .ov-label { margin: 0 0 6px; font-size: 15px; color: var(--muted); }
  .ov-num {
    margin: 0;
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-weight: 900;
    font-stretch: 62%;
    font-size: 84px;
    line-height: .82;
    font-variant-numeric: tabular-nums;
  }
  .ov-of { font-size: 34px; font-weight: 700; font-stretch: 75%; color: var(--dim); }
  .ticks { display: flex; flex-wrap: wrap; gap: 7px; margin: 16px 0 18px; }
  .tgroup { display: flex; gap: 3px; }
  .tick {
    position: relative;
    width: 9px; height: 26px;
    background: #2b3035;
    transform: skewX(-14deg);
    overflow: hidden;
  }
  .tick i {
    position: absolute; inset: 0;
    background: var(--text);
    transform-origin: bottom center;
    transform: scaleY(0);
  }
  .tgroup[data-state="warn"] .tick i { background: var(--yellow); }
  .tgroup[data-state="limit"] .tick i { background: var(--orange); }
  .tgroup[data-state="over"] .tick i { background: var(--red); }

  .hold {
    position: relative;
    width: 100%;
    height: 50px;
    overflow: hidden;
    border: 0;
    background: var(--plate-2);
    box-shadow: inset 0 0 0 1px var(--line);
    color: var(--text);
    font-weight: 700;
    font-stretch: 112%;
    font-size: 14px;
    letter-spacing: .06em;
    text-transform: uppercase;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%);
  }
  .hold .fill {
    position: absolute; inset: 0;
    background: var(--orange);
    transform-origin: left center;
    transform: scaleX(0);
  }
  .hold .lbl { position: relative; }
  .hold:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }

  /* ---------- tiles ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 18px;
  }
  .tile {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto auto 1fr auto;
    grid-template-areas: "head" "readout" "meter" "info" "actions";
    min-height: 452px;
    padding: 20px 20px 18px;
    background: linear-gradient(180deg, var(--plate-2), var(--plate) 70%);
    clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, 0 100%);
  }
  .outline {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    overflow: visible;
  }
  .outline path {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
    stroke-dasharray: 1;
    transition: stroke .3s;
  }
  .tile[data-state="limit"] .outline path { stroke: var(--orange); }
  .tile[data-state="over"] .outline path { stroke: var(--red); stroke-width: 2; }

  .shutter {
    display: none;
    position: absolute; inset: 0;
    z-index: 5;
    transform-origin: top center;
    background: repeating-linear-gradient(180deg, #31363c 0 13px, #23272b 13px 15px, #3d434a 15px 16px);
  }
  .shutter::after {
    content: '';
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 16px;
    background: repeating-linear-gradient(-45deg, var(--yellow) 0 10px, var(--ink) 10px 20px);
  }
  .motion .shutter { display: block; }

  .t-head {
    grid-area: head;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    min-height: 24px;
    padding-right: 10px;
  }
  .code {
    font-weight: 800;
    font-stretch: 125%;
    font-size: 14px;
    letter-spacing: .1em;
    color: var(--text);
    padding: 3px 7px;
    border: 1px solid var(--line-2);
  }
  .tday {
    display: flex; align-items: center; gap: 7px;
    font-size: 14px; font-weight: 600; color: var(--yellow);
  }
  .tday::before {
    content: '';
    width: 8px; height: 8px;
    background: var(--yellow);
    transform: rotate(45deg);
  }

  .readout { grid-area: readout; margin-top: 22px; }
  .big { display: flex; align-items: flex-end; gap: 8px; }
  .reel {
    display: block;
    height: .9em;
    overflow: hidden;
    font-weight: 900;
    font-stretch: 62%;
    font-size: 132px;
    line-height: .9;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    transition: color .3s;
  }
  .strip { display: block; }
  .strip span { display: block; height: .9em; }
  .of {
    font-weight: 700; font-stretch: 75%; font-size: 30px; line-height: 1;
    color: var(--dim);
    padding-bottom: 8px;
  }
  .status {
    margin: 10px 0 0;
    font-weight: 700;
    font-stretch: 112%;
    font-size: 15px;
    letter-spacing: .02em;
    color: var(--muted);
    transition: color .3s;
  }
  .tile[data-state="warn"] .reel, .tile[data-state="warn"] .status { color: var(--yellow); }
  .tile[data-state="limit"] .reel, .tile[data-state="limit"] .status { color: var(--orange); }
  .tile[data-state="over"] .reel, .tile[data-state="over"] .status { color: var(--red); }

  .meter { grid-area: meter; display: flex; align-items: center; gap: 6px; margin-top: 14px; }
  .cell {
    position: relative;
    flex: 1;
    height: 14px;
    background: #2d3237;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.5);
    transform: skewX(-14deg);
    overflow: hidden;
  }
  .cell i {
    position: absolute; inset: 0;
    background: var(--text);
    transform-origin: left center;
    transform: scaleX(0);
  }
  .tile[data-state="warn"] .cell i { background: var(--yellow); }
  .tile[data-state="limit"] .cell i { background: var(--orange); }
  .tile[data-state="over"] .cell i {
    background: repeating-linear-gradient(-45deg, var(--red) 0 6px, #b3241a 6px 12px);
  }
  .extra {
    min-width: 30px;
    font-weight: 800; font-stretch: 112%; font-size: 14px;
    color: var(--red);
    text-align: right;
  }

  .info {
    grid-area: info;
    margin-top: 22px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  .name {
    margin: 0 0 6px;
    font-weight: 700;
    font-stretch: 87.5%;
    font-size: 20px;
    line-height: 1.15;
  }
  .meta { margin: 0; font-size: 14.5px; line-height: 1.4; color: var(--muted); }

  .actions {
    grid-area: actions;
    display: grid;
    grid-template-columns: 52px 1fr;
    gap: 8px;
    margin-top: 18px;
  }
  .btn {
    height: 50px;
    border: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .b-undo {
    background: transparent;
    border: 1px solid var(--line-2);
    color: var(--text);
    font-size: 26px;
    font-weight: 500;
    line-height: 1;
  }
  .b-undo:hover:not(:disabled) { border-color: var(--text); }
  .b-add {
    background: var(--text);
    color: var(--ink);
    font-weight: 800;
    font-stretch: 112%;
    font-size: 14px;
    letter-spacing: .07em;
    text-transform: uppercase;
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
    transition: background .15s;
  }
  .b-add:hover:not(:disabled) { background: var(--yellow); }

  .hazard {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 8px;
    transform-origin: left center;
    transform: scaleX(0);
    background: repeating-linear-gradient(-45deg, var(--orange) 0 8px, var(--ink) 8px 16px);
    background-size: 22.6px 8px;
  }
  .tile[data-state="over"] .hazard {
    background-image: repeating-linear-gradient(-45deg, var(--red) 0 8px, var(--ink) 8px 16px);
  }
  .motion .tile[data-state="over"] .hazard { animation: crawl .8s linear infinite; }
  @keyframes crawl { to { background-position: 22.6px 0; } }

  .ghost {
    position: absolute;
    z-index: 3;
    pointer-events: none;
    font-weight: 900;
    font-stretch: 62%;
    font-size: 44px;
    line-height: 1;
  }

  /* ---------- today tile ---------- */
  .today {
    container-type: inline-size;
    grid-template-rows: auto auto 1fr auto;
    grid-template-areas: "head" "day" "list" "foot";
    background: var(--yellow);
    color: var(--ink);
  }
  .today .outline path { stroke: rgba(0,0,0,.28); }
  .today .t-head {
    font-weight: 800; font-stretch: 125%; font-size: 13px;
    letter-spacing: .1em; text-transform: uppercase;
  }
  .tt-day {
    grid-area: day;
    margin: 26px 0 0;
    font-weight: 900;
    font-stretch: 62%;
    font-size: min(80px, 22cqi);
    line-height: .85;
    white-space: nowrap;
    text-transform: uppercase;
  }
  .tt-list {
    grid-area: list;
    list-style: none;
    margin: 20px 0 0;
    padding: 0;
    border-top: 2px solid var(--ink);
    align-self: start;
  }
  .tt-list li {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    column-gap: 14px;
    gap: 10px;
    align-items: center;
    padding: 9px 0;
    border-bottom: 1px solid rgba(0,0,0,.22);
  }
  .tt-list li.done { opacity: .45; }
  .tt-time { min-width: 60px; font-weight: 800; font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tt-what { min-width: 0; }
  .tt-code { display: block; font-weight: 900; font-stretch: 75%; font-size: 21px; line-height: 1; }
  .tt-room { display: block; font-size: 13px; margin-top: 2px; }
  .tt-tag {
    font-weight: 800; font-stretch: 125%; font-size: 11px;
    letter-spacing: .08em; text-transform: uppercase;
    padding: 4px 7px;
    background: var(--ink); color: var(--yellow);
  }
  .tt-empty { grid-area: list; margin: 20px 0 0; padding-top: 14px; border-top: 2px solid var(--ink); font-size: 17px; font-weight: 600; line-height: 1.35; }
  .tt-empty span { display: block; margin-top: 8px; font-weight: 400; font-size: 15px; }
  .tt-foot {
    grid-area: foot;
    height: 16px;
    margin: 18px -20px -18px;
    background: repeating-linear-gradient(-45deg, var(--ink) 0 10px, transparent 10px 20px);
  }

  .foot {
    margin: 30px 0 0;
    font-size: 15px;
    color: var(--muted);
  }

  /* ---------- initial states for the power-up sequence ---------- */
  .motion .tape { transform: scaleY(0); }
  .motion .ch > span { transform: translateY(105%); }
  .motion .ov-num, .motion .overview .ov-label { opacity: 0; }

  /* ---------- responsive ---------- */
  @media (max-width: 1220px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 920px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .head { grid-template-columns: 1fr; }
    .overview { max-width: 420px; }
  }
  @media (max-width: 600px) {
    .wrap { padding: 28px 16px 36px; }
    .head { margin-bottom: 26px; gap: 22px; }
    .sub { font-size: 13px; margin-top: 14px; }
    .ov-num { font-size: 68px; }
    .grid { grid-template-columns: 1fr; gap: 14px; }
    .tile {
      min-height: 0;
      grid-template-columns: auto minmax(0, 1fr);
      grid-template-rows: auto auto auto auto;
      grid-template-areas: "head head" "readout info" "meter meter" "actions actions";
      column-gap: 18px;
      padding: 18px 16px 16px;
    }
    .readout { margin-top: 14px; }
    .reel { font-size: 104px; }
    .of { font-size: 24px; padding-bottom: 6px; }
    .status { font-size: 13.5px; }
    .info { margin-top: 18px; padding-top: 0; padding-left: 14px; border-top: 0; border-left: 1px solid var(--line); align-self: start; }
    .name { font-size: 18px; }
    .meta { font-size: 13.5px; }
    .meter { margin-top: 16px; }
    .today { grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "day" "list" "foot"; }
    .tt-day { margin-top: 18px; }
    .tt-foot { margin: 16px -16px -16px; }
  }
</style>
</head>
<body>

<div class="tape" id="tape" aria-hidden="true"><div class="tape-track" id="tapeTrack"></div></div>

<main class="wrap">
  <header class="head">
    <div>
      <h1 class="title">
        <span class="sr-only">Section E</span>
        <span class="chars" id="chars" aria-hidden="true"></span>
      </h1>
      <p class="sub"><span id="sub">Module 2 attendance</span></p>
    </div>
    <div class="overview">
      <p class="ov-label">Total missed across all courses</p>
      <p class="ov-num"><span id="totalNum">00</span><span class="ov-of" id="allowance">/21</span></p>
      <div class="ticks" id="ticks" aria-hidden="true"></div>
      <button type="button" class="hold" id="reset" aria-describedby="reset-hint">
        <span class="fill" aria-hidden="true"></span>
        <span class="lbl" id="resetLbl">Hold to reset all</span>
      </button>
      <span class="sr-only" id="reset-hint">Press and hold to set every course back to zero misses.</span>
    </div>
  </header>

  <section class="grid" id="grid" aria-label="Courses"></section>

  <p class="foot" id="foot"></p>
</main>

<div class="sr-only" aria-live="polite" id="live"></div>

<script>

<script>
(() => {
  'use strict';

  /* ---------------------------------------------------------------
     Section E, Module 2. Days: 0 Sun … 6 Sat. Times: 24h start.
     --------------------------------------------------------------- */
  const COURSES = [
    { id: 'sdb',  code: 'SDB',     name: 'Sustainable Development for Business',
      prof: 'Prof. Disha Sharma', room: '208',
      slots: [[1, '10:40'], [2, '12:20']] },
    { id: 'mwb',  code: 'MWB',     name: 'Managing Workplace Behaviour',
      prof: 'Prof. D.K. Srivastava', room: '208',
      slots: [[1, '12:20'], [2, '10:40'], [6, '14:00']] },
    { id: 'cf',   code: 'CF',      name: 'Corporate Finance',
      prof: 'Prof. S. K. V. Srinivasan', room: '',
      slots: [[1, '15:40'], [2, '15:40']] },
    { id: 'b2b',  code: 'B2B',     name: 'B2B Marketing',
      prof: 'Prof. Neeraj Pandey', room: '208',
      slots: [[2, '18:00'], [2, '19:40']] },
    { id: 'scm',  code: 'SCM',     name: 'Supply Chain Management',
      prof: 'Prof. Rakesh Raut / Prof. Ravindra Gokhale', room: '405',
      slots: [[3, '12:20'], [4, '10:40']] },
    { id: 'aiml', code: 'AI & ML', name: 'Business Applications of AI & ML Techniques',
      prof: 'Prof. J. Rambabu', room: '208',
      slots: [[3, '15:40'], [4, '15:40']] },
    { id: 'pm',   code: 'PM',      name: 'Project Management',
      prof: 'Prof. B. Koteswararao Naik', room: 'Auditorium',
      slots: [[3, '18:00'], [3, '19:40']] },
  ];

  const LIMIT = 3;
  const CAP = 9;
  const CLASS_MIN = 90;
  const HOLD_MS = 1200;
  const KEY = 'attendance:section-e:module-2:v1';
  const DAY_SHORT = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const DAY_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

  const A = window.anime && typeof window.anime.animate === 'function' ? window.anime : null;
  const motion = !!A && document.documentElement.classList.contains('motion');

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const roomText = c => !c.room ? '' : /^\d/.test(c.room) ? `Room ${c.room}` : c.room;

  /* ---------- storage ---------- */
  let storageOK = true;
  function load() {
    const out = Object.fromEntries(COURSES.map(c => [c.id, 0]));
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return out;
      const m = (JSON.parse(raw) || {}).misses || {};
      COURSES.forEach(c => {
        const n = Number(m[c.id]);
        out[c.id] = Number.isFinite(n) ? Math.max(0, Math.min(CAP, Math.round(n))) : 0;
      });
    } catch (e) { /* start clean */ }
    return out;
  }
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ v: 1, misses: state, savedAt: new Date().toISOString() }));
      storageOK = true;
    } catch (e) { storageOK = false; }
    renderFoot();
  }
  try { localStorage.setItem(KEY + ':probe', '1'); localStorage.removeItem(KEY + ':probe'); }
  catch (e) { storageOK = false; }

  let state = load();
  const totalMissed = () => COURSES.reduce((s, c) => s + state[c.id], 0);

  /* ---------- formatting ---------- */
  const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  function fmt(t) {
    let [h, m] = t.split(':').map(Number);
    const ap = h >= 12 ? 'pm' : 'am';
    h = h % 12 || 12;
    return `${h}:${String(m).padStart(2, '0')} ${ap}`;
  }
  function whenText(c) {
    const groups = [];
    c.slots.forEach(([d, t]) => {
      let g = groups.find(x => x.d === d);
      if (!g) groups.push(g = { d, ts: [] });
      g.ts.push(fmt(t));
    });
    return groups.map(g => `${DAY_SHORT[g.d]} ${g.ts.join(' & ')}`).join(', ');
  }
  function status(n) {
    if (n > LIMIT) return { state: 'over', text: `Over the limit by ${n - LIMIT}` };
    if (n === LIMIT) return { state: 'limit', text: 'No misses left' };
    const left = LIMIT - n;
    return { state: left === 1 ? 'warn' : 'ok', text: `${left} ${left === 1 ? 'miss' : 'misses'} left` };
  }

  /* ---------- small anime helpers ---------- */
  function put(el, props) {
    if (A) { A.utils.set(el, props); return; }
    const t = [];
    if ('translateY' in props) t.push(`translateY(${props.translateY})`);
    if ('scaleX' in props) t.push(`scaleX(${props.scaleX})`);
    if ('scaleY' in props) t.push(`scaleY(${props.scaleY})`);
    if (t.length) el.style.transform = t.join(' ');
    if ('opacity' in props) el.style.opacity = props.opacity;
  }
  function setText(el, text, animate) {
    if (el.textContent === text) return;
    if (animate && motion && A.scrambleText) {
      A.animate(el, { innerHTML: A.scrambleText({ text, chars: 'A-Z0-9', revealRate: 90, settleDuration: 200 }) });
    } else {
      el.textContent = text;
    }
  }
  const kf = (values, total) => values.map(to => ({ to, duration: total / values.length }));

  /* ---------- title ---------- */
  $('#chars').innerHTML = 'Section E'.split('').map(ch =>
    ch === ' ' ? '<span class="ch sp"><span>&nbsp;</span></span>' : `<span class="ch"><span>${esc(ch)}</span></span>`
  ).join('');

  /* ---------- tiles ---------- */
  const grid = $('#grid');
  const units = {};
  const digits = Array.from({ length: CAP + 1 }, (_, i) => `<span>${i}</span>`).join('');

  const todayTile = document.createElement('article');
  todayTile.className = 'tile today';
  todayTile.setAttribute('aria-labelledby', 'tt-day');
  todayTile.innerHTML = `
    <svg class="outline" aria-hidden="true" focusable="false"><path pathLength="1"/></svg>
    <div class="t-head"><span>Today</span><span id="tt-date"></span></div>
    <h2 class="tt-day" id="tt-day"></h2>
    <ul class="tt-list" id="tt-list"></ul>
    <p class="tt-empty" id="tt-empty" hidden></p>
    <div class="tt-foot" aria-hidden="true"></div>
    <div class="shutter" aria-hidden="true"></div>`;
  grid.appendChild(todayTile);

  COURSES.forEach(c => {
    const el = document.createElement('article');
    el.className = 'tile course';
    el.dataset.id = c.id;
    el.setAttribute('aria-labelledby', `n-${c.id}`);
    const meta = [c.prof, roomText(c)].filter(Boolean).join(', ');
    el.innerHTML = `
      <svg class="outline" aria-hidden="true" focusable="false"><path pathLength="1"/></svg>
      <div class="t-head">
        <span class="code" aria-hidden="true">${esc(c.code)}</span>
        <span class="tday" hidden></span>
      </div>
      <div class="readout">
        <div class="big" role="img">
          <span class="reel"><span class="strip" data-id="${c.id}">${digits}</span></span>
          <span class="of" aria-hidden="true">/${LIMIT}</span>
        </div>
        <p class="status"></p>
      </div>
      <div class="meter" aria-hidden="true">
        ${'<span class="cell"><i></i></span>'.repeat(LIMIT)}
        <span class="extra"></span>
      </div>
      <div class="info">
        <h2 class="name" id="n-${c.id}">${esc(c.name)}</h2>
        <p class="meta">${esc(meta)}</p>
        <p class="meta">${esc(whenText(c))}</p>
      </div>
      <div class="actions">
        <button type="button" class="btn b-undo" data-act="remove" aria-label="Remove a miss from ${esc(c.name)}">&minus;</button>
        <button type="button" class="btn b-add" data-act="add" aria-label="Log a miss for ${esc(c.name)}">Log a miss</button>
      </div>
      <div class="hazard" aria-hidden="true"></div>
      <div class="shutter" aria-hidden="true"></div>`;
    grid.appendChild(el);
    units[c.id] = {
      el,
      big: $('.big', el),
      reel: $('.reel', el),
      strip: $('.strip', el),
      status: $('.status', el),
      fills: $$('.cell i', el),
      extra: $('.extra', el),
      hazard: $('.hazard', el),
      outline: $('.outline path', el),
      tday: $('.tday', el),
      add: $('[data-act="add"]', el),
      remove: $('[data-act="remove"]', el),
    };
  });

  // chamfered outline paths that match each tile's size
  function sizeOutlines() {
    $$('.tile', grid).forEach(t => {
      const w = t.clientWidth, h = t.clientHeight;
      const cut = parseFloat(getComputedStyle(t).getPropertyValue('--cut')) || 22;
      const svg = $('.outline', t);
      svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
      $('path', svg).setAttribute('d', `M.5 .5 H${w - cut} L${w - .5} ${cut} V${h - .5} H.5 Z`);
    });
  }
  sizeOutlines();
  if ('ResizeObserver' in window) new ResizeObserver(sizeOutlines).observe(grid);
  else window.addEventListener('resize', sizeOutlines);

  /* ---------- header ticks: one group of 3 per course ---------- */
  const ticks = $('#ticks');
  ticks.innerHTML = COURSES.map(c =>
    `<span class="tgroup" data-id="${c.id}">${'<span class="tick"><i></i></span>'.repeat(LIMIT)}</span>`
  ).join('');
  $('#allowance').textContent = `/${LIMIT * COURSES.length}`;

  function renderTicks(animate) {
    COURSES.forEach(c => {
      const g = $(`.tgroup[data-id="${c.id}"]`, ticks);
      const n = state[c.id];
      g.dataset.state = status(n).state;
      $$('i', g).forEach((i, k) => {
        const on = k < Math.min(n, LIMIT);
        const was = i.dataset.on === '1';
        i.dataset.on = on ? '1' : '0';
        if (animate && motion && on !== was) {
          A.animate(i, { scaleY: on ? 1 : 0, duration: on ? 500 : 260, ease: on ? 'outBack(2)' : 'in(2)' });
        } else if (!animate || !motion) {
          put(i, { scaleY: on ? 1 : 0 });
        }
      });
    });
  }

  const totalEl = $('#totalNum');
  let shownTotal = 0;
  const pad2 = n => String(Math.round(n)).padStart(2, '0');
  function renderTotal(animate) {
    const t = totalMissed();
    if (animate && motion) {
      const o = { v: shownTotal };
      A.animate(o, { v: t, duration: 600, ease: 'out(3)', onUpdate: () => { totalEl.textContent = pad2(o.v); } });
    } else {
      totalEl.textContent = pad2(t);
    }
    shownTotal = t;
  }

  /* ---------- one course tile ---------- */
  function update(id, prev, animate) {
    const n = state[id];
    const u = units[id];
    const st = status(n);
    const anim = animate && motion;
    const prevState = u.el.dataset.state;

    u.el.dataset.state = st.state;
    u.big.setAttribute('aria-label', `${n} of ${LIMIT} misses used`);
    u.remove.disabled = n === 0;
    u.add.disabled = n >= CAP;
    setText(u.status, st.text, animate);
    setText(u.extra, n > LIMIT ? `+${n - LIMIT}` : '', animate);

    // number reel
    const y = `${-Math.min(n, CAP) * 10}%`;
    if (anim) A.animate(u.strip, { translateY: y, ease: A.spring({ bounce: 0.35, duration: 520 }) });
    else put(u.strip, { translateY: y });

    // meter cells
    u.fills.forEach((f, k) => {
      const on = k < Math.min(n, LIMIT);
      const was = f.dataset.on === '1';
      f.dataset.on = on ? '1' : '0';
      if (!anim) { put(f, { scaleX: on ? 1 : 0 }); return; }
      if (on && !was) {
        A.animate(f, { scaleX: [0, 1], duration: 420, ease: 'out(4)' });
        A.animate(f, { opacity: kf([0.3, 1, 0.5, 1], 360), ease: 'linear' });
      } else if (!on && was) {
        A.animate(f, { scaleX: 0, duration: 280, ease: 'in(3)' });
      }
    });

    // hazard band along the bottom once the limit is reached
    const haz = n >= LIMIT;
    if (anim && (haz !== (u.hazard.dataset.on === '1'))) {
      A.animate(u.hazard, { scaleX: haz ? 1 : 0, duration: haz ? 600 : 300, ease: haz ? 'out(4)' : 'in(2)' });
    } else if (!anim) {
      put(u.hazard, { scaleX: haz ? 1 : 0 });
    }
    u.hazard.dataset.on = haz ? '1' : '0';

    if (!anim || n === prev) return;

    // impact on the tile
    A.animate(u.el, { scale: [n > prev ? 0.975 : 1.012, 1], ease: A.spring({ bounce: 0.55, duration: 420 }) });

    // redraw the outline when the tile changes alarm level
    if (st.state !== prevState && (st.state === 'limit' || st.state === 'over')) {
      A.animate(u.outline, { strokeDashoffset: [1, 0], duration: 700, ease: 'inOut(3)' });
    }
    // shake on hitting or passing the limit
    if (n > prev && n >= LIMIT) {
      A.animate(u.el, { translateX: kf([-8, 7, -5, 3, -1, 0], 440), ease: 'inOut(2)' });
    }
    // floating +1 / −1
    const g = document.createElement('span');
    g.className = 'ghost';
    g.textContent = n > prev ? '+1' : '−1';
    g.style.color = getComputedStyle(u.reel).color;
    const rb = u.reel.getBoundingClientRect(), tb = u.el.getBoundingClientRect();
    g.style.left = `${rb.right - tb.left + 4}px`;
    g.style.top = `${rb.top - tb.top + rb.height * 0.12}px`;
    u.el.appendChild(g);
    A.animate(g, {
      translateY: [10, -22], opacity: [{ to: 1, duration: 120 }, { to: 1, duration: 260 }, { to: 0, duration: 320 }],
      duration: 700, ease: 'out(3)', onComplete: () => g.remove(),
    });
  }

  /* ---------- today tile + tape ---------- */
  function scheduleFor(day) {
    const items = [];
    COURSES.forEach(c => c.slots.forEach(([d, t]) => { if (d === day) items.push({ c, t, m: toMin(t) }); }));
    return items.sort((a, b) => a.m - b.m);
  }
  function nextAfter(now) {
    const d = now.getDay(), mins = now.getHours() * 60 + now.getMinutes();
    for (let k = 1; k <= 7; k++) {
      const day = (d + k) % 7;
      const items = scheduleFor(day);
      if (items.length) return { day, item: items[0] };
    }
    return null;
  }

  let renderedDay = -1;
  function renderToday() {
    const now = new Date();
    const d = now.getDay();
    const mins = now.getHours() * 60 + now.getMinutes();
    const items = scheduleFor(d);

    $('#tt-date').textContent = now.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    $('#tt-day').textContent = DAY_LONG[d];

    let nextTagged = false;
    items.forEach(it => {
      if (mins >= it.m && mins < it.m + CLASS_MIN) it.tag = 'Now';
      else if (mins >= it.m + CLASS_MIN) it.tag = 'Done';
      else if (!nextTagged) { it.tag = 'Next'; nextTagged = true; }
    });

    const list = $('#tt-list'), empty = $('#tt-empty');
    if (items.length) {
      list.hidden = false; empty.hidden = true;
      list.innerHTML = items.map(it => `
        <li class="${it.tag === 'Done' ? 'done' : ''}">
          <span class="tt-time">${fmt(it.t)}</span>
          <span class="tt-what"><span class="tt-code">${esc(it.c.code)}</span>${roomText(it.c) ? `<span class="tt-room">${esc(roomText(it.c))}</span>` : ''}</span>
          ${it.tag && it.tag !== 'Done' ? `<span class="tt-tag">${it.tag}</span>` : '<span></span>'}
        </li>`).join('');
    } else {
      list.hidden = true; empty.hidden = false;
      const nx = nextAfter(now);
      empty.innerHTML = `No Section E classes today.` +
        (nx ? `<span>Next up: ${DAY_LONG[nx.day]} at ${fmt(nx.item.t)}, ${esc(nx.item.c.code)}${roomText(nx.item.c) ? ' in ' + esc(roomText(nx.item.c)) : ''}.</span>` : '');
    }

    COURSES.forEach(c => {
      const ts = scheduleFor(d).filter(it => it.c === c).map(it => fmt(it.t));
      const el = units[c.id].tday;
      el.hidden = !ts.length;
      el.textContent = ts.length ? `Today ${ts.join(' & ')}` : '';
    });

    if (renderedDay !== d) { renderedDay = d; buildTape(items, d); }
    sizeOutlines();
  }

  let tapeAnim = null;
  function buildTape(items, d) {
    const parts = [`Section E`, `Module 2`, `Max ${LIMIT} misses per course`];
    if (items.length) items.forEach(it => parts.push(`${DAY_SHORT[d]} ${fmt(it.t)} ${it.c.code}${it.c.room ? ' / ' + roomText(it.c) : ''}`));
    else parts.push(`No classes ${DAY_LONG[d]}`);
    const once = parts.map(p => `<span class="tape-item">${esc(p)}</span><span class="tape-sep"></span>`).join('');
    const track = $('#tapeTrack');
    track.innerHTML = once + once + once + once;
    if (tapeAnim) { tapeAnim.pause(); tapeAnim = null; }
    if (!motion) return;
    const quarter = track.scrollWidth / 4;
    A.utils.set(track, { translateX: 0 });
    tapeAnim = A.animate(track, { translateX: -quarter, duration: quarter * 22, ease: 'linear', loop: true });
  }

  /* ---------- footer + announcements ---------- */
  function renderFoot() {
    $('#foot').textContent = storageOK
      ? `You can miss up to ${LIMIT} classes per course. Counts save automatically in this browser.`
      : `You can miss up to ${LIMIT} classes per course. This browser is blocking storage, so counts will be lost when you close the page.`;
  }
  const live = $('#live');
  function announce(msg) { live.textContent = ''; requestAnimationFrame(() => { live.textContent = msg; }); }

  /* ---------- add / remove ---------- */
  grid.addEventListener('click', e => {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const id = btn.closest('.course').dataset.id;
    const prev = state[id];
    const next = btn.dataset.act === 'add' ? Math.min(CAP, prev + 1) : Math.max(0, prev - 1);
    if (next === prev) return;
    state[id] = next;
    save();
    update(id, prev, true);
    renderTicks(true);
    renderTotal(true);
    const c = COURSES.find(x => x.id === id);
    announce(`${c.name}: ${next} missed. ${status(next).text}.`);
  });

  // tactile press on buttons
  if (motion) {
    grid.addEventListener('pointerdown', e => {
      const b = e.target.closest('.btn');
      if (b && !b.disabled) A.animate(b, { scale: 0.92, duration: 90, ease: 'out(2)' });
    });
    const release = e => {
      const b = e.target.closest && e.target.closest('.btn');
      if (b) A.animate(b, { scale: 1, ease: A.spring({ bounce: 0.6, duration: 380 }) });
    };
    grid.addEventListener('pointerup', release);
    grid.addEventListener('pointerout', release);
  }

  /* ---------- hold to reset ---------- */
  const holdBtn = $('#reset');
  const holdFill = $('.fill', holdBtn);
  const holdLbl = $('#resetLbl');
  let holding = false, holdAnim = null, holdTimer = null;

  function holdStart() {
    if (holding) return;
    holding = true;
    if (A) {
      if (holdAnim) holdAnim.pause();
      holdAnim = A.animate(holdFill, { scaleX: 1, duration: HOLD_MS, ease: 'linear', onComplete: holdDone });
    } else {
      holdFill.style.transition = `transform ${HOLD_MS}ms linear`;
      holdFill.style.transform = 'scaleX(1)';
      holdTimer = setTimeout(holdDone, HOLD_MS);
    }
  }
  function drain(ms) {
    if (A) {
      if (holdAnim) holdAnim.pause();
      holdAnim = A.animate(holdFill, { scaleX: 0, duration: ms, ease: 'out(2)' });
    } else {
      clearTimeout(holdTimer);
      holdFill.style.transition = `transform ${ms}ms ease-out`;
      holdFill.style.transform = 'scaleX(0)';
    }
  }
  function holdEnd() {
    if (!holding) return;
    holding = false;
    drain(260);
  }
  function holdDone() {
    holding = false;
    const prevs = { ...state };
    COURSES.forEach(c => { state[c.id] = 0; });
    save();
    announce('All courses reset to zero misses.');
    setText(holdLbl, 'Reset done', true);
    setTimeout(() => setText(holdLbl, 'Hold to reset all', true), 2000);
    setTimeout(() => drain(420), 300);

    if (!motion) {
      COURSES.forEach(c => update(c.id, prevs[c.id], false));
      renderTicks(false); renderTotal(false);
      return;
    }
    // shutters roll down, panel resets behind them, shutters roll back up
    const shutters = COURSES.map(c => $('.shutter', units[c.id].el));
    const tl = A.createTimeline();
    tl.add(shutters, { scaleY: [0, 1], duration: 420, ease: 'in(3)', delay: A.stagger(60) })
      .call(() => {
        COURSES.forEach(c => update(c.id, prevs[c.id], false));
        renderTicks(true);
        renderTotal(true);
      })
      .add(shutters, { scaleY: [1, 0], duration: 640, ease: 'out(3)', delay: A.stagger(60) }, '+=180');
  }

  holdBtn.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    try { holdBtn.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    holdStart();
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => holdBtn.addEventListener(t, holdEnd));
  holdBtn.addEventListener('keydown', e => {
    if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); holdStart(); }
  });
  holdBtn.addEventListener('keyup', e => {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); holdEnd(); }
  });
  holdBtn.addEventListener('blur', holdEnd);
  holdBtn.addEventListener('contextmenu', e => e.preventDefault());

  /* ---------- sync across tabs, refresh on return ---------- */
  window.addEventListener('storage', e => {
    if (e.key !== KEY) return;
    const next = load();
    COURSES.forEach(c => {
      if (next[c.id] !== state[c.id]) { const p = state[c.id]; state[c.id] = next[c.id]; update(c.id, p, true); }
    });
    renderTicks(true); renderTotal(true);
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') renderToday(); });
  setInterval(renderToday, 60 * 1000);
  let resizeT, lastW = window.innerWidth;
  window.addEventListener('resize', () => {
    if (window.innerWidth === lastW) return;
    lastW = window.innerWidth;
    clearTimeout(resizeT);
    resizeT = setTimeout(() => { renderedDay = -1; renderToday(); }, 200);
  });

  /* ---------- power-up sequence ---------- */
  renderFoot();
  renderToday();
  COURSES.forEach(c => update(c.id, state[c.id], false));
  renderTicks(false);
  renderTotal(false);

  if (motion) {
    const strips = COURSES.map(c => units[c.id].strip);
    const fillsOn = $$('.cell i[data-on="1"]', grid);
    const ticksOn = $$('.tick i[data-on="1"]', ticks);
    const hazOn = $$('.hazard[data-on="1"]', grid);
    const tiles = $$('.tile', grid);
    const shutters = $$('.shutter', grid);
    const cols = getComputedStyle(grid).gridTemplateColumns.split(' ').length;
    const rows = Math.ceil(tiles.length / cols);

    A.utils.set(strips, { translateY: '0%' });
    A.utils.set('.outline path', { strokeDashoffset: 1 });
    if (fillsOn.length) A.utils.set(fillsOn, { scaleX: 0 });
    if (ticksOn.length) A.utils.set(ticksOn, { scaleY: 0 });
    if (hazOn.length) A.utils.set(hazOn, { scaleX: 0 });
    totalEl.textContent = '00';
    shownTotal = 0;

    const tl = A.createTimeline({ defaults: { ease: 'out(4)' } });
    tl.add('#tape', { scaleY: [0, 1], duration: 380 }, 0)
      .add('.ch > span', { translateY: ['105%', '0%'], duration: 820, delay: A.stagger(48) }, 120)
      .add('.overview .ov-label, .ov-num', { opacity: [0, 1], translateY: [14, 0], duration: 600, delay: A.stagger(90) }, 420)
      .add(shutters, {
        scaleY: [1, 0], duration: 760, ease: 'inOut(3)',
        delay: A.stagger(90, { grid: [cols, rows], from: 'first' }),
      }, 520)
      .add('.outline path', {
        strokeDashoffset: [1, 0], duration: 1000, ease: 'inOut(2)',
        delay: A.stagger(90, { grid: [cols, rows], from: 'first' }),
      }, 760)
      .add(strips, {
        translateY: el => `${-Math.min(state[el.dataset.id], CAP) * 10}%`,
        duration: 900, ease: 'out(3)', delay: A.stagger(80),
      }, 1050)
      .call(() => renderTotal(true), 700);
    if (ticksOn.length) tl.add(ticksOn, { scaleY: [0, 1], duration: 480, ease: 'outBack(2)', delay: A.stagger(35) }, 760);
    if (fillsOn.length) tl.add(fillsOn, { scaleX: [0, 1], duration: 480, delay: A.stagger(60) }, 1250);
    if (hazOn.length) tl.add(hazOn, { scaleX: [0, 1], duration: 620, delay: A.stagger(80) }, 1500);

    A.animate('#sub', { innerHTML: A.scrambleText({ chars: 'A-Z0-9', revealRate: 34, settleDuration: 260 }), delay: 380 });
  }
})();
</script>
</body>
</html>
